<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Engine Minimal</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: white; color: black; }
    button { padding: 12px 24px; font-size: 1.2rem; cursor: pointer; }
    .result { font-size: 2rem; margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>D&D Dice Engine (test)</h2>
  <button id="rollBtn">Roll d20</button>
  <div class="result" id="result">&mdash;</div>

  <script>
    document.getElementById('rollBtn').addEventListener('click', function() {
      var roll = Math.floor(Math.random() * 20) + 1;
      document.getElementById('result').textContent = roll;
    });
  </script>
</body>
</html>
