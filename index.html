<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;D Dice Engine</title>
<style>
:root {
  --black: #000000;
  --white: #ffffff;
  --deep-blue: #1e3a8a;
  --gray: #f3f4f6;
  --border: 2px solid var(--black);
  --shadow: 4px 4px 0 var(--black);
  --font-mono: 'Courier New', Courier, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans);
  background: var(--white);
  color: var(--black);
  padding: 16px;
  min-width: 320px;
  max-width: 420px;
}
.v-card {
  background: var(--white);
  border: var(--border);
  box-shadow: var(--shadow);
  padding: 20px;
}
.v-title {
  font-size: 1.3rem;
  font-weight: 900;
  text-transform: uppercase;
  border-bottom: var(--border);
  padding-bottom: 8px;
  margin-bottom: 16px;
  color: var(--black);
}
.v-label { font-weight: 700; font-size: 0.9rem; }
.v-btn {
  background: var(--deep-blue);
  color: var(--white);
  border: var(--border);
  padding: 8px 14px;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.1s, box-shadow 0.1s;
  text-transform: uppercase;
  font-family: var(--font-sans);
  box-shadow: 2px 2px 0 var(--black);
}
.v-btn:hover { background: #162b6b; }
.v-btn:active {
  box-shadow: none;
  transform: translate(2px, 2px);
}
.v-btn.small { padding: 4px 10px; font-size: 0.75rem; }
.v-input, .v-select {
  border: var(--border);
  padding: 4px 8px;
  font-size: 0.9rem;
  font-family: var(--font-mono);
  background: var(--white);
  color: var(--black);
}
.v-input.small-input { width: 50px; }
.v-select.small-select { width: 80px; }
.v-stat.result {
  font-family: var(--font-mono);
  font-size: 2.5rem;
  font-weight: 900;
  color: var(--deep-blue);
  text-align: center;
  padding: 12px;
  border: var(--border);
  margin-top: 12px;
  background: var(--gray);
  word-break: break-all;
}
.dice-selection { margin-bottom: 16px; }
.dice-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.die-btn { min-width: 44px; text-align: center; }
.selected-die {
  font-family: var(--font-mono);
  font-weight: 900;
  font-size: 1rem;
  color: var(--deep-blue);
}
.modifiers { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
.mod-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
.roll-section { margin-bottom: 24px; }
.roll-btn { width: 100%; padding: 14px; font-size: 1.2rem; }
.history-section { margin-top: 16px; }
.history-list {
  max-height: 200px;
  overflow-y: auto;
  border: var(--border);
  padding: 8px;
  margin: 8px 0;
  background: var(--gray);
  font-size: 0.85rem;
}
.history-item {
  font-family: var(--font-mono);
  padding: 4px 0;
  border-bottom: 1px dashed var(--black);
}
.history-item:last-child { border-bottom: none; }
.history-item .hidden-badge { color: var(--deep-blue); font-weight: bold; }
.no-history { color: #666; font-style: italic; }
#clear-history { margin-top: 4px; }
</style>
</head>
<body>
<div class="v-card">
  <h1 class="v-title">D&amp;D Dice Engine</h1>

  <div class="dice-selection">
    <label class="v-label">Choose Die:</label>
    <div class="dice-buttons">
      <button class="v-btn die-btn" data-die="4">d4</button>
      <button class="v-btn die-btn" data-die="6">d6</button>
      <button class="v-btn die-btn" data-die="8">d8</button>
      <button class="v-btn die-btn" data-die="10">d10</button>
      <button class="v-btn die-btn" data-die="12">d12</button>
      <button class="v-btn die-btn" data-die="20">d20</button>
      <button class="v-btn die-btn" data-die="100">d100</button>
    </div>
    <div class="selected-die"><span id="current-die-display">d20</span></div>
  </div>

  <div class="modifiers">
    <div class="mod-row">
      <label for="modifier">Modifier:</label>
      <input type="number" id="modifier" value="0" class="v-input">
    </div>
    <div class="mod-row" id="advantage-row">
      <label>Advantage/Disadvantage:</label>
      <select id="advantage-select" class="v-select">
        <option value="none">None</option>
        <option value="advantage">Advantage</option>
        <option value="disadvantage">Disadvantage</option>
      </select>
    </div>
    <div class="mod-row">
      <label><input type="checkbox" id="exploding-check"> Exploding Dice</label>
    </div>
    <div class="mod-row" id="keep-row">
      <label for="keep-count">Keep Highest/Lowest:</label>
      <input type="number" id="keep-count" value="1" min="1" class="v-input small-input">
      <select id="keep-type" class="v-select small-select">
        <option value="highest">Highest</option>
        <option value="lowest">Lowest</option>
      </select>
      <span>of</span>
      <input type="number" id="keep-total" value="2" min="2" class="v-input small-input">
      <span>dice</span>
    </div>
    <div class="mod-row">
      <label><input type="checkbox" id="hidden-roll-check"> Hidden Roll (GM only)</label>
    </div>
  </div>

  <div class="roll-section">
    <button id="roll-button" class="v-btn roll-btn">Roll!</button>
    <div class="v-stat result"><span id="result-text">&mdash;</span></div>
  </div>

  <div class="history-section">
    <h2 class="v-title">Roll History</h2>
    <div id="history-list" class="history-list">
      <p class="no-history">No rolls yet.</p>
    </div>
    <button id="clear-history" class="v-btn small">Clear History</button>
  </div>
</div>

<script>
(function() {
  // State
  var selectedDie = 20;
  var modifier = 0;
  var advantage = 'none';
  var exploding = false;
  var keepTotal = 2;
  var keepCount = 1;
  var keepType = 'highest';
  var hiddenRoll = false;
  var history = [];

  // Wait for DOM
  function init() {
    var dieButtons = document.querySelectorAll('.die-btn');
    var modifierInput = document.getElementById('modifier');
    var advantageSelect = document.getElementById('advantage-select');
    var explodingCheck = document.getElementById('exploding-check');
    var keepCountInput = document.getElementById('keep-count');
    var keepTypeSelect = document.getElementById('keep-type');
    var keepTotalInput = document.getElementById('keep-total');
    var hiddenCheck = document.getElementById('hidden-roll-check');
    var rollButton = document.getElementById('roll-button');
    var currentDieDisplay = document.getElementById('current-die-display');
    var advantageRow = document.getElementById('advantage-row');
    var clearHistoryBtn = document.getElementById('clear-history');

    if (!rollButton) {
      // DOM not ready yet, retry
      setTimeout(init, 50);
      return;
    }

    currentDieDisplay.textContent = 'd20';

    dieButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        selectedDie = parseInt(btn.dataset.die);
        currentDieDisplay.textContent = 'd' + selectedDie;
        if (selectedDie === 20) {
          advantageRow.style.display = 'flex';
        } else {
          advantageRow.style.display = 'none';
          advantage = 'none';
          advantageSelect.value = 'none';
        }
      });
    });

    modifierInput.addEventListener('input', function(e) {
      modifier = parseInt(e.target.value) || 0;
    });

    advantageSelect.addEventListener('change', function(e) {
      advantage = e.target.value;
    });

    explodingCheck.addEventListener('change', function(e) {
      exploding = e.target.checked;
    });

    keepCountInput.addEventListener('input', function(e) {
      keepCount = parseInt(e.target.value) || 1;
      if (keepCount < 1) keepCount = 1;
      e.target.value = keepCount;
    });

    keepTypeSelect.addEventListener('change', function(e) {
      keepType = e.target.value;
    });

    keepTotalInput.addEventListener('input', function(e) {
      keepTotal = parseInt(e.target.value) || 2;
      if (keepTotal < 2) keepTotal = 2;
      e.target.value = keepTotal;
    });

    hiddenCheck.addEventListener('change', function(e) {
      hiddenRoll = e.target.checked;
    });

    rollButton.addEventListener('click', function() {
      performRoll();
    });

    clearHistoryBtn.addEventListener('click', function() {
      history.length = 0;
      renderHistory();
    });

    renderHistory();
  }

  function randomDie(max) {
    return Math.floor(Math.random() * max) + 1;
  }

  function rollExplodingDie(max) {
    var total = 0;
    var parts = [];
    while (true) {
      var roll = randomDie(max);
      parts.push(roll);
      total += roll;
      if (roll !== max) break;
    }
    return { value: total, parts: parts };
  }

  function performRoll() {
    // Try to use OBR SDK for GM detection, but don't block on it
    var useHidden = hiddenRoll;
    
    if (useHidden && window.OBR && window.OBR.player && typeof window.OBR.player.getPlayers === 'function') {
      // Async check
      window.OBR.player.getPlayers().then(function(players) {
        var isGM = false;
        if (players && players.length > 0) {
          for (var i = 0; i < players.length; i++) {
            if (players[i].id === window.OBR.player.id) {
              isGM = players[i].role === 'GM';
              break;
            }
          }
        }
        executeRoll(isGM);
      }).catch(function() {
        executeRoll(false);
      });
    } else {
      // No OBR, just do the roll (hidden will show ??? for non-GM, but since we can't detect, show result)
      executeRoll(true); // Treat as GM if can't detect
    }
  }

  function executeRoll(isGM) {
    try {
      var totalRolls = 1;
      var resultParts = [];
      var finalResult = 0;

      if (selectedDie === 20 && advantage !== 'none') {
        totalRolls = 2;
      }
      if (keepTotal > 1 && keepCount > 0 && keepCount < keepTotal) {
        totalRolls = keepTotal;
      }

      var rolls = [];
      for (var i = 0; i < totalRolls; i++) {
        if (exploding) {
          var rr = rollExplodingDie(selectedDie);
          rolls.push(rr.value);
          if (rr.parts.length > 1) {
            resultParts.push('d' + selectedDie + ': ' + rr.parts.join(' + ') + ' = ' + rr.value);
          } else {
            resultParts.push('d' + selectedDie + ': ' + rr.value);
          }
        } else {
          var r = randomDie(selectedDie);
          rolls.push(r);
          resultParts.push('d' + selectedDie + ': ' + r);
        }
      }

      if (totalRolls > 1 && keepCount > 0 && keepCount < rolls.length) {
        var sorted = rolls.slice().sort(function(a, b) { return a - b; });
        var kept;
        if (keepType === 'highest') {
          kept = sorted.slice(-keepCount);
        } else {
          kept = sorted.slice(0, keepCount);
        }
        var keptSum = kept.reduce(function(acc, v) { return acc + v; }, 0);
        resultParts.push('Keep ' + keepType + ' ' + keepCount + ': [' + kept.join(', ') + '] = ' + keptSum);
        finalResult = keptSum;
      } else if (totalRolls === 2 && selectedDie === 20 && advantage !== 'none') {
        if (advantage === 'advantage') {
          finalResult = Math.max(rolls[0], rolls[1]);
          resultParts.push('Advantage: max = ' + finalResult);
        } else {
          finalResult = Math.min(rolls[0], rolls[1]);
          resultParts.push('Disadvantage: min = ' + finalResult);
        }
      } else {
        finalResult = rolls.reduce(function(acc, v) { return acc + v; }, 0);
        if (rolls.length > 1) {
          resultParts.push('Sum: ' + finalResult);
        }
      }

      var totalWithMod = finalResult + modifier;
      var displayText = String(finalResult);
      if (modifier !== 0) {
        var sign = modifier >= 0 ? '+' : '';
        displayText = finalResult + ' ' + sign + modifier + ' = ' + totalWithMod;
      }

      var resultEl = document.getElementById('result-text');
      if (hiddenRoll && !isGM) {
        resultEl.textContent = '??? (Hidden)';
      } else {
        resultEl.textContent = displayText;
      }

      var entry = {
        timestamp: new Date().toLocaleTimeString(),
        die: 'd' + selectedDie,
        detail: resultParts.join(' | '),
        total: totalWithMod,
        hidden: hiddenRoll
      };

      if (!hiddenRoll || isGM) {
        history.unshift(entry);
        if (history.length > 50) history.pop();
      }
      renderHistory();

    } catch (error) {
      console.error('Roll failed:', error);
      var el = document.getElementById('result-text');
      if (el) el.textContent = 'Error!';
    }
  }

  function renderHistory() {
    var list = document.getElementById('history-list');
    if (!list) return;
    if (history.length === 0) {
      list.innerHTML = '<p class="no-history">No rolls yet.</p>';
      return;
    }
    var html = '';
    for (var i = 0; i < history.length; i++) {
      var e = history[i];
      html += '<div class="history-item">
